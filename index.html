<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موجز - لوحة أخصائي تقويم المواد الميدانية</title>
    
    <!-- CSS الخاص بالشريط الإخباري والنافذة المنبثقة -->
    <style>
        /* === تنسيق الشريط الإخباري البيضاوي === */
        .news-ticker-oval {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-radius: 50px; /* شكل بيضاوي */
            padding: 4px 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            width: 320px;
            height: 48px;
            overflow: hidden;
            position: relative;
            margin: 0 15px;
        }

        .ticker-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .ticker-content img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 20px;
            transition: opacity 0.4s ease-in-out;
        }

        .no-news-text {
            font-size: 0.85rem;
            color: #64748b;
        }

        .btn-manage-news {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-manage-news:hover {
            background: #f1f5f9;
        }

        /* === تنسيق النافذة المنبثقة (Modal) لإدارة الأخبار === */
        .news-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .news-modal-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .news-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .news-modal-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #1e293b;
        }

        .close-modal-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #64748b;
        }

        .upload-section {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 1px dashed #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            background: #f8fafc;
            color: #334155;
            font-size: 0.9rem;
        }

        .custom-file-upload:hover {
            background: #f1f5f9;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .news-item img {
            width: 60px;
            height: 35px;
            object-fit: cover;
            border-radius: 4px;
        }

        .delete-news-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .delete-news-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <!-- الهيدر الرئيسي مع إضافة الشريط البيضاوي -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e2e8f0;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 2rem;">🎓</div>
            <div>
                <h2 style="margin: 0; font-size: 1.2rem;">موجز <span style="font-size: 0.8rem; color: #3b82f6;">إصدار 3.2</span></h2>
                <p style="margin: 0; font-size: 0.85rem; color: #64748b;">لوحة أخصائي تقويم المواد الميدانية</p>
            </div>
        </div>

        <!-- 🟢 الشريط الإخباري البيضاوي -->
        <div class="news-ticker-oval" id="newsTicker">
            <div class="ticker-content">
                <img id="newsImage" src="" alt="خبر" style="display:none;" />
                <span id="noNewsText" class="no-news-text">لا توجد أخبار حالياً</span>
            </div>
            <button id="manageNewsBtn" class="btn-manage-news" onclick="openNewsModal()" title="إدارة الأخبار">⚙️</button>
        </div>
    </header>

    <!-- 🟢 النافذة المنبثقة لإدارة الأخبار (Modal) -->
    <div class="news-modal-overlay" id="newsModal">
        <div class="news-modal-content">
            <div class="news-modal-header">
                <h3>🖼️ إدارة صور الأخبار</h3>
                <button class="close-modal-btn" onclick="closeNewsModal()">&times;</button>
            </div>
            
            <div class="upload-section">
                <label for="imageInput" class="custom-file-upload">
                    📤 اضغط هنا لاختيار صورة خبر جديد
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <div class="news-list" id="newsList">
                <!-- يتم توليد عناصر الأخبار هنا تلقائياً -->
            </div>
        </div>
    </div>

    <!-- JavaScript الخاص بالتشغيل والتفاعل -->
    <script>
        let newsImages = JSON.parse(localStorage.getItem('news_images') || '[]');
        let currentIndex = 0;
        let tickerInterval = null;

        // تحديث إطار عرض الصور كل ثانيتين
        function updateTicker() {
            const imgEl = document.getElementById('newsImage');
            const textEl = document.getElementById('noNewsText');

            if (!newsImages || newsImages.length === 0) {
                imgEl.style.display = 'none';
                textEl.style.display = 'inline';
                return;
            }

            textEl.style.display = 'none';
            imgEl.style.display = 'block';

            // تأثير اختفاء وظهور ناعم
            imgEl.style.opacity = 0;
            setTimeout(() => {
                if (newsImages[currentIndex]) {
                    imgEl.src = newsImages[currentIndex];
                    imgEl.style.opacity = 1;
                }
                currentIndex = (currentIndex + 1) % newsImages.length;
            }, 200);
        }

        // بدء الدوران التلقائي كل ثانيتين (2000 مللي ثانية)
        function startTicker() {
            if (tickerInterval) clearInterval(tickerInterval);
            updateTicker();
            if (newsImages.length > 0) {
                tickerInterval = setInterval(updateTicker, 2000);
            }
        }

        // إيقاف التبديل عند توجيه الماوس على الخبر لرؤيته بوضوح
        const tickerEl = document.getElementById('newsTicker');
        tickerEl.addEventListener('mouseenter', () => clearInterval(tickerInterval));
        tickerEl.addEventListener('mouseleave', () => {
            if (newsImages.length > 0) tickerInterval = setInterval(updateTicker, 2000);
        });

        // فتح وإغلاق النافذة المنبثقة
        function openNewsModal() {
            renderNewsList();
            document.getElementById('newsModal').style.display = 'flex';
        }

        function closeNewsModal() {
            document.getElementById('newsModal').style.display = 'none';
        }

        // رفع وتخزين صورة جديدة
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                newsImages.push(e.target.result);
                localStorage.setItem('news_images', JSON.stringify(newsImages));
                renderNewsList();
                startTicker();
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // إعادة تعيين مدخل الملف
        }

        // حذف صورة خبر
        function deleteNews(index) {
            newsImages.splice(index, 1);
            localStorage.setItem('news_images', JSON.stringify(newsImages));
            if (currentIndex >= newsImages.length) currentIndex = 0;
            renderNewsList();
            startTicker();
        }

        // عرض قائمة الأخبار المرفوعة داخل النافذة المنبثقة
        function renderNewsList() {
            const listEl = document.getElementById('newsList');
            listEl.innerHTML = '';

            if (newsImages.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:0.85rem;">لا توجد صور مرفوعة حالياً</p>';
                return;
            }

            newsImages.forEach((imgSrc, idx) => {
                const item = document.createElement('div');
                item.className = 'news-item';
                item.innerHTML = `
                    <img src="${imgSrc}" alt="خبر ${idx + 1}">
                    <span>خبر رقم ${idx + 1}</span>
                    <button class="delete-news-btn" onclick="deleteNews(${idx})">حذف</button>
                `;
                listEl.appendChild(item);
            });
        }

        // التشغيل التلقائي عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', startTicker);
    </script>
</body>
</html>
